- insert:
  - id: preset-helloworld
    name: '@deepseek-ai/dsh-agent-preset'
    config:
      id: hello-world
      name: HelloWorld
      description: A minimal preset with persona only.
      order: 99
      plugins:
        - id: persona
          name: '@deepseek-ai/dsh-persona'
          config:
            prefix: |
              你是 Hello World 示例 preset。
              你的第一条回复必须以 “Hello, world!” 开头，并用一句话说明你来自 hello-world preset。
        - id: skill-filesystem
          name: '@deepseek-ai/dsh-skill-filesystem'
          config:
            customSkillDirs:
              - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@potterhe/dsh-helloworld/package.json')), 'skills')
        - id: tool-skill
          name: '@deepseek-ai/dsh-tool-skill'
  - id: hello
    name: '@potterhe/dsh-helloworld'